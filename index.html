<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Аниме">
<title>Аниме</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fafbfd;--ink:#0f1b26;--mute:#66727f;--line:#d8dee5;--accent:#3d6a8d;--band:#e9edf1;--on:#fff;--sky1:#b9d3e8;--sky2:#eef3f8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--ink:#e8edf2;--mute:#8b97a3;--line:#26303a;--accent:#7fb0d6;--band:#151d26;--on:#0e141b;--sky1:#1c3044;--sky2:#0e141b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141b;--ink:#e8edf2;--mute:#8b97a3;--line:#26303a;--accent:#7fb0d6;--band:#151d26;--on:#0e141b;--sky1:#1c3044;--sky2:#0e141b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Manrope",-apple-system,"Segoe UI",Roboto,sans-serif}
.mono,.eyebrow,.jp,.sec,.lab,.next,.chips a,.row button,.tag,.imp button,.r{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;max-width:760px;margin:0 auto}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo i{color:var(--accent);font-style:normal}
.jp{color:var(--mute);font-size:13px}
.hero{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);padding:48px 20px 24px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end}
.in{max-width:760px;margin:0 auto;width:100%}
.eyebrow{font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.rule{width:40px;height:1px;background:var(--ink)}
h1{font-size:clamp(56px,19vw,120px);letter-spacing:-.04em;font-weight:600;line-height:1;margin:16px 0 12px}
.lead{max-width:30ch;margin:0 0 22px}
.tag{display:inline-block;background:var(--bg);font-size:12px;padding:8px 12px}
main{max-width:760px;margin:0 auto;padding:0 20px 40px}
section{padding:44px 0 8px}
section+section{border-top:1px solid var(--line);margin-top:36px}
.sec{color:var(--accent);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}
h2{font-size:clamp(28px,7vw,40px);letter-spacing:-.03em;font-weight:500;margin:0 0 20px;line-height:1.15}
input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:12px 0}
input::placeholder{color:var(--mute)}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.imp{margin-top:18px}
.imp button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:0}
#impMsg{margin:12px 0 0;color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 10px}
.tabs button{background:none;border:0;border-left:1px solid var(--line);border-bottom:2px solid transparent;padding:6px 10px 14px;text-align:left;color:var(--ink);cursor:pointer;font:inherit;display:grid;gap:18px;align-content:start}
.tabs button:first-child{border-left:0;padding-left:0}
.tabs .r{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.tabs b{font-size:13px;font-weight:500;line-height:1.25}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent)}
.tabs button[aria-pressed="true"] b{color:var(--accent)}
.item{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.cover{width:92px;height:130px;object-fit:cover;background:var(--band);border-radius:2px}
.lab{font-weight:500;font-size:11px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.t{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25;overflow-wrap:anywhere}
.orig{color:var(--mute);font-size:13px;margin:2px 0 0}
.ep{font-size:14px;margin:8px 0 0}
.next{font-weight:500;font-size:12px;line-height:1.4;color:var(--accent);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips a{font-size:12px;border:1px solid var(--line);padding:4px 8px;color:var(--ink);text-decoration:none}
.chips .none{color:var(--mute);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 11px;font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:0}
.row .main{background:var(--accent);border-color:var(--accent);color:var(--on)}
.msg{color:var(--mute);padding:32px 0;border-top:1px solid var(--line)}
.more[hidden]{display:none}
.more{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:0}
.ver{text-align:center;color:var(--mute);font-size:12px;padding:8px 0 24px}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.subs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 11px;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.03em;cursor:pointer;border-radius:0}
.subs button i{font-style:normal;color:var(--mute);margin-left:4px}
.subs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.subs button[aria-pressed="true"] i{color:inherit}
.row select{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 8px;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.03em;text-transform:uppercase;border-radius:0;max-width:100%}
.prof{padding:6px 0 10px}
.pname{font-size:clamp(28px,8vw,44px);letter-spacing:-.03em;font-weight:600;margin:18px 0 4px;line-height:1.1;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1px solid var(--line)}
.stat{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:18px 0;color:var(--ink);cursor:pointer;font:inherit}
.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.stat:nth-child(even){padding-left:16px}
.stat:last-child:nth-child(odd){grid-column:1/-1;border-right:0}
.stat .num{display:block;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.stat .lab2{display:block;margin-top:8px;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
</style>
</head>
<body>
<header class="top"><a class="logo" href="./">аниме<i>.</i></a><span class="jp">アニメ</span></header>
<div class="hero"><div class="in">
<p class="eyebrow"><span class="rule"></span>Личный список <span class="jp">/ リスト</span></p>
<h1>аниме</h1>
<p class="lead">Каталог, серии и расписание выхода в одном месте.</p>
<span class="tag">日常 — смотрю и жду</span>
</div></div>
<main>
<section>
<p class="sec">01 / Поиск</p>
<h2>Найти аниме</h2>
<input id="q" type="search" placeholder="Название по-русски или по-английски" autocomplete="off">
<div class="imp"><button type="button" id="impBtn">Импорт списка из Anixart (CSV)</button><input type="file" id="file" accept=".csv,.txt,text/*" hidden><p id="impMsg"></p></div>
</section>
<section>
<p class="sec">02 / Разделы</p>
<h2>Что смотрим</h2>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<button class="more" id="more" hidden>Показать ещё</button>
</section>
</main>
<p class="ver">Версия 6</p>
<script>
var API="https://graphql.anilist.co";
var F="id idMal title{romaji english} coverImage{large color} episodes status format averageScore nextAiringEpisode{episode airingAt} externalLinks{site url type} siteUrl";
var TABS={airing:"Сейчас выходит",soon:"Скоро",mine:"Мой список",profile:"Профиль"};
var STATS={watch:"Смотрю",done:"Просмотрено",plan:"Буду смотреть",drop:"Брошено",wait:"Ожидает выхода"},sub="plan";
var STAT={RELEASING:"Выходит",FINISHED:"Завершено",NOT_YET_RELEASED:"Анонс",CANCELLED:"Отменено",HIATUS:"Пауза"};
var KEY="anime:mine",mine={},mode="airing",query="",page=1,items=[],hasMore=false,timer,token=0;
function load(){try{mine=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){mine={}}Object.keys(mine).forEach(function(id){if(typeof mine[id]!=="object"||mine[id]===null)mine[id]={s:"plan"}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mine))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return/^https:\/\//.test(u||"")?u:"#"}
function gql(q,v){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:q,variables:v})}).then(function(r){return r.json()}).then(function(j){if(j.errors)throw new Error(j.errors[0].message);return j.data.Page})}
var ru={};
function isRu(s){return/[а-яё]/i.test(s)}
function shiki(q,p){return fetch("https://shikimori.one/api/animes?search="+encodeURIComponent(q)+"&limit=20&page="+p+"&order=popularity").then(function(r){if(!r.ok)throw new Error("shiki");return r.json()})}
function requestRu(){
 return shiki(query,page).then(function(list){
  list.forEach(function(a){if(a.russian)ru[a.id]=a.russian});
  var ids=list.map(function(a){return Number(a.id)});
  if(!ids.length)return{pageInfo:{hasNextPage:false},media:[]};
  return gql("query($ids:[Int]){Page(perPage:50){media(idMal_in:$ids,type:ANIME,isAdult:false){"+F+"}}}",{ids:ids}).then(function(p){
   p.media.sort(function(a,b){return ids.indexOf(a.idMal)-ids.indexOf(b.idMal)});
   p.pageInfo={hasNextPage:list.length>=20};return p})
 })
}
function request(){
 if(query&&isRu(query))return requestRu();
 if(query)return gql("query($p:Int,$s:String){Page(page:$p,perPage:20){pageInfo{hasNextPage}media(type:ANIME,search:$s,sort:SEARCH_MATCH,isAdult:false){"+F+"}}}",{p:page,s:query});
 if(mode==="mine"){var all=Object.keys(mine).filter(function(k){return mine[k].s===sub}).map(Number),ids=all.slice((page-1)*50,page*50);if(!ids.length)return Promise.resolve({pageInfo:{hasNextPage:false},media:[]});return gql("query($ids:[Int]){Page(perPage:50){media(id_in:$ids,type:ANIME){"+F+"}}}",{ids:ids}).then(function(p){p.pageInfo={hasNextPage:all.length>page*50};return p})}
 var st=mode==="soon"?"NOT_YET_RELEASED":"RELEASING";
 return gql("query($p:Int){Page(page:$p,perPage:20){pageInfo{hasNextPage}media(type:ANIME,status:"+st+",sort:POPULARITY_DESC,isAdult:false){"+F+"}}}",{p:page})
}
function aired(x){if(x.nextAiringEpisode)return x.nextAiringEpisode.episode-1;if(x.status==="FINISHED")return x.episodes||0;return 0}
function fmtDate(ts){return new Date(ts*1000).toLocaleDateString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}
function card(x){
 var orig=x.title.english||x.title.romaji,name=ru[x.idMal]||orig,a=aired(x),id=String(x.id),saved=id in mine;
 var links=(x.externalLinks||[]).filter(function(l){return l.type==="STREAMING"});
 var epLine=x.status==="NOT_YET_RELEASED"?"Серии ещё не выходили"+(x.episodes?", запланировано "+x.episodes:""):"Вышло серий: "+a+(x.episodes?" из "+x.episodes:" (всего пока неизвестно)");
 var h='<article class="item" data-id="'+id+'"><img class="cover" loading="lazy" alt="" src="'+esc(safeUrl(x.coverImage&&x.coverImage.large))+'"><div>';
 h+='<p class="lab">'+esc(STAT[x.status]||x.status)+(x.format?" / "+esc(x.format):"")+(x.averageScore?" / "+x.averageScore+"%":"")+'</p>';
 h+='<h3 class="t">'+esc(name)+'</h3>'+(name!==orig?'<p class="orig">'+esc(orig)+'</p>':"");
 h+='<p class="ep">'+epLine+'</p>';
 if(x.nextAiringEpisode)h+='<p class="next">→ серия '+x.nextAiringEpisode.episode+", "+esc(fmtDate(x.nextAiringEpisode.airingAt))+"</p>";
 h+='<div class="chips">'+(links.length?links.map(function(l){return'<a href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener noreferrer">'+esc(l.site)+"</a>"}).join(""):'<span class="none">Легальных ссылок в базе пока нет</span>')+'<a href="'+esc(safeUrl(x.siteUrl))+'" target="_blank" rel="noopener noreferrer">AniList</a></div>';
 h+='<div class="row">';
 if(saved)h+='<select data-a="status" aria-label="Статус">'+Object.keys(STATS).map(function(k){return'<option value="'+k+'"'+(mine[id].s===k?" selected":"")+">"+STATS[k]+"</option>"}).join("")+"</select>";
 h+='<button class="'+(saved?"":"main")+'" data-a="toggle" type="button">'+(saved?"Убрать":"В мой список")+"</button>";
 return h+"</div></div></article>"
}
function render(msg){
 document.getElementById("tabs").innerHTML=Object.keys(TABS).map(function(k,i){var jp={airing:"放送中",soon:"近日",mine:"自分",profile:"私"}[k];return'<button type="button" data-tab="'+k+'" aria-pressed="'+(!query&&k===mode)+'"><span class="r"><span>0'+(i+1)+'</span><span>'+jp+'</span></span><b>'+TABS[k]+"</b></button>"}).join("");
 var el=document.getElementById("list"),pre=(mode==="mine"&&!query)?subsHtml():"";
 if(mode==="profile"&&!query){el.innerHTML=profileHtml();var nm=document.getElementById("nm");if(nm)nm.oninput=function(e){setName(e.target.value);var pn=document.getElementById("pn");if(pn)pn.textContent=e.target.value||"Мой профиль"};document.getElementById("more").hidden=true;return}
 if(msg)el.innerHTML=pre+'<div class="msg">'+msg+"</div>";
 else if(!items.length)el.innerHTML=pre+'<div class="msg">'+(mode==="mine"&&!query?"В этом разделе пока пусто. Найдите аниме и нажмите «В мой список».":"Ничего не найдено.")+"</div>";
 else el.innerHTML=pre+items.map(card).join("");
 document.getElementById("more").hidden=!hasMore||!!msg
}
function counts(){var c={watch:0,done:0,plan:0,drop:0,wait:0};Object.keys(mine).forEach(function(k){var t=mine[k].s;if(t in c)c[t]++});return c}
function subsHtml(){var c=counts();return'<div class="subs">'+Object.keys(STATS).map(function(k){return'<button type="button" data-sub="'+k+'" aria-pressed="'+(k===sub)+'">'+STATS[k]+" <i>"+c[k]+"</i></button>"}).join("")+"</div>"}
function getName(){try{return localStorage.getItem("anime:name")||""}catch(e){return""}}
function setName(v){try{localStorage.setItem("anime:name",v)}catch(e){}}
function profileHtml(){
 var c=counts(),total=Object.keys(mine).length,name=getName();
 return'<div class="prof"><p class="lab">Имя</p><input id="nm" value="'+esc(name)+'" maxlength="30" placeholder="Как вас называть" autocomplete="off"><h3 class="pname" id="pn">'+esc(name||"Мой профиль")+'</h3><p class="ep">Всего в списке: '+total+'</p><div class="stats">'+Object.keys(STATS).map(function(k){return'<button type="button" class="stat" data-go="'+k+'"><span class="num">'+c[k]+'</span><span class="lab2">'+STATS[k]+"</span></button>"}).join("")+"</div></div>"
}
function fetchPage(append){
 var my=++token;
 if(!append)render("Загружаем…");
 request().then(function(p){
  if(my!==token)return;
  items=append?items.concat(p.media):p.media;hasMore=!!(p.pageInfo&&p.pageInfo.hasNextPage);render()
 }).catch(function(){if(my===token)render(query&&isRu(query)?"Русский поиск сейчас недоступен. Попробуйте ввести название по-английски или ромадзи.":"Не удалось загрузить данные. Проверьте интернет и попробуйте ещё раз.")})
}
function reset(){page=1;items=[];if(mode==="profile"&&!query){hasMore=false;token++;render();return}fetchPage(false)}
document.getElementById("q").oninput=function(e){clearTimeout(timer);var v=e.target.value.trim();timer=setTimeout(function(){query=v;reset()},400)};
document.getElementById("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;mode=b.dataset.tab;query="";document.getElementById("q").value="";reset()};
document.getElementById("more").onclick=function(){page++;fetchPage(true)};
document.getElementById("list").onclick=function(e){
 var g=e.target.closest("[data-go]");if(g){mode="mine";sub=g.dataset.go;query="";document.getElementById("q").value="";reset();return}
 var sb=e.target.closest("[data-sub]");if(sb){sub=sb.dataset.sub;reset();return}
 var b=e.target.closest("button"),it=e.target.closest(".item");if(!b||!it||b.dataset.a!=="toggle")return;
 var id=it.dataset.id;
 if(id in mine)delete mine[id];else mine[id]={s:"plan"};
 save();afterChange(id)
};
document.getElementById("list").onchange=function(e){
 var t=e.target,it=t.closest(".item");if(!it||t.dataset.a!=="status")return;
 var id=it.dataset.id;if(mine[id])mine[id].s=t.value;save();afterChange(id)
};
function afterChange(id){
 if(mode==="mine"&&!query&&(!(id in mine)||mine[id].s!==sub))items=items.filter(function(i){return String(i.id)!==id});
 render()
}

function parseCSV(t){var rows=[],row=[],f="",q=false;t=t.replace(/^\uFEFF/,"");for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function post(query,vars,msg){
 var err="нет ответа";
 for(var t=0;t<5;t++){
  try{
   var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:query,variables:vars})});
   if(r.status===429){var w=parseInt(r.headers.get("Retry-After"),10)||60;msg.textContent="Лимит запросов AniList, ждём "+w+" с…";await sleep(w*1000);err="лимит запросов";continue}
   var j=await r.json();
   if(j.data)return{data:j.data};
   err=(j.errors&&j.errors[0]&&j.errors[0].message)||("ошибка "+r.status);
   await sleep(3000)
  }catch(e){err="сеть: "+(e&&e.message||e);await sleep(3000)}
 }
 return{err:err}
}
function mkQuery(chunk){var vars={},decl=[],body=[];chunk.forEach(function(t,i){vars["s"+i]=t.q;decl.push("$s"+i+":String");body.push("p"+i+":Page(perPage:1){media(search:$s"+i+",type:ANIME,isAdult:false,sort:SEARCH_MATCH){id}}")});return{query:"query("+decl.join(",")+"){"+body.join(" ")+"}",vars:vars}}
function res1(t,p,st){var m=p&&p.media&&p.media[0];if(m&&m.id)st.found.push({t:t,id:m.id});else st.miss.push(t)}
async function runBatches(list,label,msg,st){
 var B=5;
 for(var s=0;s<list.length;s+=B){
  var chunk=list.slice(s,s+B);
  msg.textContent=label+": "+Math.min(s+B,list.length)+" из "+list.length+"…";
  var q=mkQuery(chunk),res=await post(q.query,q.vars,msg);
  if(res.data)chunk.forEach(function(t,i){res1(t,res.data["p"+i],st)});
  else for(var k=0;k<chunk.length;k++){
   var q1=mkQuery([chunk[k]]),r1=await post(q1.query,q1.vars,msg);
   if(r1.data)res1(chunk[k],r1.data.p0,st);else{st.failed.push(chunk[k]);st.reason=r1.err}
   await sleep(2500)
  }
  await sleep(2500)
 }
}
function alt(q){return q.replace(/\s*(Part|Cour)\s*\d+/i,"").replace(/\s*\d+(st|nd|rd|th)\s*Season/i,"").replace(/\s*Season\s*\d+/i,"").replace(/\s*[:\-–].*$/,"").trim()}
async function importList(list){
 var msg=document.getElementById("impMsg"),done={},skipped=0;
 try{done=JSON.parse(localStorage.getItem("anime:imp")||"{}")||{}}catch(e){done={}}
 var todo=list.filter(function(t){if(t.q in done&&String(done[t.q]) in mine){skipped++;return false}return true});
 var st={found:[],miss:[],failed:[],reason:""};
 await runBatches(todo,"Импорт",msg,st);
 var second=[],keep=[];
