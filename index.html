<style>

:root[data-theme="dark"]{--bg:#0e141b;--ink:#e8edf2;--mute:#8b97a3;--line:#26303a;--accent:#7fb0d6;--band:#151d26;--on:#0e141b;--sky1:#1c3044;--sky2:#0e141b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Manrope",-apple-system,"Segoe UI",Roboto,sans-serif}
.mono,.eyebrow,.jp,.sec,.lab,.next,.chips a,.row button,.tag,.imp button,.r{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;max-width:760px;margin:0 auto}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo i{color:var(--accent);font-style:normal}

main{max-width:760px;margin:0 auto;padding:0 20px 40px}
section{padding:44px 0 8px}
section+section{border-top:1px solid var(--line);margin-top:36px}
.sec{color:var(--accent);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}
h2{font-size:clamp(28px,7vw,40px);letter-spacing:-.03em;font-weight:500;margin:0 0 20px;line-height:1.15}
input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:12px 0}

.grp{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:26px 0 0;padding-top:14px;border-top:1px solid var(--ink)}

.prof{padding:6px 0 10px}
.key textarea{display:block;width:100%;min-height:96px;margin:10px 0;font:12px/1.4 "IBM Plex Mono",monospace;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:0;padding:10px}

.bkrow button{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 12px;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:background .2s,transform .15s}

.key{margin-top:32px}
.key .orig a,.msg a{color:var(--accent)}
.pname{font-size:clamp(28px,8vw,44px);letter-spacing:-.03em;font-weight:600;margin:18px 0 4px;line-height:1.1;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1px solid var(--line)}

.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.stat:nth-child(even){padding-left:16px}
.stat:last-child:nth-child(odd){grid-column:1/-1;border-right:0}
.stat .num{display:block;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.stat .lab2{display:block;margin-top:8px;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

:root{--glow:rgba(255,255,255,.55)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:rgba(127,176,214,.28)}}
:root[data-theme="dark"]{--glow:rgba(127,176,214,.28)}
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drift{0%{background-position:0% 0%}50%{background-position:100% 100%}100%{background-position:0% 0%}}
@keyframes glow{0%,100%{opacity:.55;transform:translate(0,0) scale(1)}50%{opacity:1;transform:translate(-8%,6%) scale(1.18)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{to{background-position:-200% 0}}
.hero{position:relative;overflow:hidden;background-size:200% 200%;animation:drift 18s ease-in-out infinite}
.hero::before{content:"";position:absolute;width:70vw;height:70vw;max-width:520px;max-height:520px;right:-12%;top:-25%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);animation:glow 9s ease-in-out infinite;pointer-events:none}
.hero .in{position:relative}
.hero .in>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.hero .in>:nth-child(2){animation-delay:.1s}
.hero .in>:nth-child(3){animation-delay:.2s}
.hero .in>:nth-child(4){animation-delay:.3s}
.logo i{display:inline-block;animation:pulse 3.2s ease-in-out infinite}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
#list.anim>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#list.anim>:nth-child(2){animation-delay:.05s}
#list.anim>:nth-child(3){animation-delay:.1s}
#list.anim>:nth-child(4){animation-delay:.15s}
#list.anim>:nth-child(5){animation-delay:.2s}
#list.anim>:nth-child(6){animation-delay:.25s}
#list.anim>:nth-child(7){animation-delay:.3s}
#list.anim>:nth-child(8){animation-delay:.35s}
#list.anim>:nth-child(9){animation-delay:.4s}
#list.anim>:nth-child(10){animation-delay:.45s}
img.cover{opacity:0;transition:opacity .6s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.item:hover .cover{transform:scale(1.04)}
.row button,.kinds button,.subs button,.tabs button,.imp button,.more,.stat{transition:background .2s,color .2s,border-color .25s,transform .15s}
.row button:active,.kinds button:active,.subs button:active,.imp button:active,.more:active,.stat:active{transform:scale(.96)}
.tabs b{transition:color .25s}
.chips a{transition:background .2s,color .2s,border-color .2s}
.chips a:hover{background:var(--accent);border-color:var(--accent);color:var(--on)}
.sk{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.sk i{display:block;border-radius:2px;background:linear-gradient(90deg,var(--band) 25%,var(--line) 50%,var(--band) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.sk .c{width:92px;height:130px}
.sk .l{height:12px;margin:0 0 12px}
.sk .l1{width:35%}
.sk .l2{width:80%;height:20px}
.sk .l3{width:60%}

.t[data-open],.cover[data-open],.pt{cursor:pointer}
.cw{position:relative;width:92px;height:130px}
.cw .cover{width:100%;height:100%}
.kpb{position:absolute;left:0;top:8px;z-index:2;background:#ff5500;color:#fff;font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.35);animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.chips .kpl{background:#ff5500;border-color:#ff5500;color:#fff}
.item.group .cover{box-shadow:5px 5px 0 -1px var(--line)}
@keyframes slideup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.detail{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);animation:slideup .35s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.detail[hidden]{display:none}
.dbar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}
.dbar button{border:0;background:transparent;color:var(--accent);font:500 13px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;padding:8px 0}
.dbody{max-width:760px;margin:0 auto;padding:22px 20px 70px}
.dhead{display:grid;grid-template-columns:120px 1fr;gap:16px}
.dcover{width:120px;height:170px;object-fit:cover;background:var(--band);border-radius:2px}
.dt{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px;overflow-wrap:anywhere}
.dorig{color:var(--mute);font-size:13px;margin:0 0 6px;overflow-wrap:anywhere}
.dhead .row{margin-top:12px}
.mrows{border-top:1px solid var(--line);margin:22px 0 14px}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow span{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);flex:none;padding-top:3px}
.mrow b{font-weight:500;text-align:right}
.chips .tg{font:12px "IBM Plex Mono",monospace;border:1px solid var(--line);padding:4px 8px}
.dh{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:30px 0 12px}
.ddesc{font-size:15px;line-height:1.65;margin:0;white-space:pre-line}
.dnote{color:var(--mute);font-size:12px;margin:8px 0 0}
.prow{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pc{width:48px;height:68px;object-fit:cover;background:var(--band);border-radius:2px}
.pt{font-weight:600;margin:0;overflow-wrap:anywhere}
.prow.cur .pt{color:var(--accent)}
.pm{color:var(--mute);font:12px "IBM Plex Mono",monospace;margin:2px 0 8px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}img.cover{opacity:1}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="./">аниме<i>.</i></a><span class="jp">アニメ</span></header>
<div class="hero"><div class="in">
<p class="eyebrow"><span class="rule"></span>Личный список <span class="jp">/ リスト</span></p>
<h1>аниме</h1>
<p class="lead">Каталог, серии и расписание выхода в одном месте.</p>
<span class="tag">日常 — смотрю и жду</span>
</div></div>
<main>
<section>
<p class="sec">01 / Поиск по всему</p>
<h2>Найти</h2>
<input id="q" type="search" placeholder="Название аниме, фильма или сериала" autocomplete="off">
<div class="imp"><button type="button" id="impBtn">Импорт списка из Anixart (CSV)</button><input type="file" id="file" accept=".csv,.txt,text/*" hidden><p id="impMsg"></p></div>
</section>
<section>
<p class="sec">02 / Разделы</p>
<h2>Что смотрим</h2>
<div class="kinds" id="kinds"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<button class="more" id="more" hidden>Показать ещё</button>
</section>
</main>
<p class="ver">Версия 14</p>
<div class="detail" id="detail" hidden><div class="dbar"><button type="button" id="dback">← Назад</button></div><div class="dbody" id="dbody"></div></div>
<script>
var API="https://graphql.anilist.co";
var F="id idMal title{romaji english} coverImage{large color} episodes status format averageScore nextAiringEpisode{episode airingAt} externalLinks{site url type} siteUrl startDate{year month day} relations{edges{relationType node{id}}}";
var TABS={airing:"Сейчас выходит",soon:"Скоро",mine:"Мой список",profile:"Профиль"};
var STATS={watch:"Смотрю",done:"Просмотрено",plan:"Буду смотреть",drop:"Брошено",wait:"Ожидает выхода"},sub="plan";
var kind="anime",lib={film:{},series:{}},rt={},shikiBad=false,animateNext=false,detail=null,mineCache={},kpm={};
var KINDS={anime:"Аниме",film:"Фильмы",series:"Сериалы"},KW={anime:"аниме",film:"фильм",series:"сериал"};
var FMT={TV:"ТВ",TV_SHORT:"ТВ-короткометражка",MOVIE:"Фильм",SPECIAL:"Спецвыпуск",OVA:"OVA",ONA:"ONA",MUSIC:"Клип"};
var STAT={RELEASING:"Выходит",FINISHED:"Завершено",NOT_YET_RELEASED:"Анонс",CANCELLED:"Отменено",HIATUS:"Пауза"};
var KEY="anime:mine",mine={},mode="airing",query="",page=1,items=[],hasMore=false,timer,token=0;
function load(){try{mine=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){mine={}}Object.keys(mine).forEach(function(id){if(typeof mine[id]!=="object"||mine[id]===null)mine[id]={s:"plan"}});try{ru=JSON.parse(localStorage.getItem("anime:ru")||"{}")||{}}catch(e){ru={}}try{lib=JSON.parse(localStorage.getItem("anime:lib")||"{}")||{}}catch(e){lib={}}lib.film=lib.film||{};lib.series=lib.series||{};try{rt=JSON.parse(localStorage.getItem("anime:rt")||"{}")||{}}catch(e){rt={}}try{kpm=JSON.parse(localStorage.getItem("anime:kpm")||"{}")||{}}catch(e){kpm={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mine))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return/^https:\/\//.test(u||"")?u:"#"}
function gql(q,v){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:q,variables:v})}).then(function(r){return r.json()}).then(function(j){if(j.errors)throw new Error(j.errors[0].message);return j.data.Page})}
var ru={};
function isRu(s){return/[а-яё]/i.test(s)}
function shiki(q,p){return fetch("https://shikimori.one/api/animes?search="+encodeURIComponent(q)+"&limit=20&page="+p+"&order=popularity").then(function(r){if(!r.ok)throw new Error("shiki");return r.json()})}
function requestRu(){
 return shiki(query,page).then(function(list){
  list.forEach(function(a){if(a.russian)ru[a.id]=a.russian});
  var ids=list.map(function(a){return Number(a.id)});
  if(!ids.length)return{pageInfo:{hasNextPage:false},media:[]};
  return gql("query($ids:[Int]){Page(perPage:50){media(idMal_in:$ids,type:ANIME,isAdult:false){"+F+"}}}",{ids:ids}).then(function(p){
   p.media.sort(function(a,b){return ids.indexOf(a.idMal)-ids.indexOf(b.idMal)});
   p.pageInfo={hasNextPage:list.length>=20};return p})
 })
}
function request(){
 if(query&&isRu(query))return requestRu();
 if(query)return gql("query($p:Int,$s:String){Page(page:$p,perPage:20){pageInfo{hasNextPage}media(type:ANIME,search:$s,sort:SEARCH_MATCH,isAdult:false){"+F+"}}}",{p:page,s:query});
 if(mode==="mine"){var all=Object.keys(mine).filter(function(k){return mine[k].s===sub}).map(Number),ids=all.slice((page-1)*50,page*50);if(!ids.length)return Promise.resolve({pageInfo:{hasNextPage:false},media:[]});return gql("query($ids:[Int]){Page(perPage:50){media(id_in:$ids,type:ANIME){"+F+"}}}",{ids:ids}).then(function(p){p.pageInfo={hasNextPage:all.length>page*50};return p})}
 var st=mode==="soon"?"NOT_YET_RELEASED":"RELEASING";
 return gql("query($p:Int){Page(page:$p,perPage:20){pageInfo{hasNextPage}media(type:ANIME,status:"+st+",sort:POPULARITY_DESC,isAdult:false){"+F+"}}}",{p:page})
}
function aired(x){if(x.nextAiringEpisode)return x.nextAiringEpisode.episode-1;if(x.status==="FINISHED")return x.episodes||0;return 0}
function fmtDate(ts){return new Date(ts*1000).toLocaleDateString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}
function card(x){
 var orig=x.title.english||x.title.romaji,name=rt[String(x.id)]||ru[x.idMal]||orig,a=aired(x),id=String(x.id),saved=id in mine;

function reset(){page=1;items=[];animateNext=true;if(mode==="profile"&&!query){hasMore=false;token++;render();return}if(query){fetchAll();return}if(kind==="anime"&&mode==="mine"){fetchMine();return}if(kind!=="anime"){fetchOther();return}fetchPage(false)}
document.getElementById("q").oninput=function(e){clearTimeout(timer);var v=e.target.value.trim();timer=setTimeout(function(){query=v;reset()},400)};
document.getElementById("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;mode=b.dataset.tab;query="";document.getElementById("q").value="";reset()};
document.getElementById("more").onclick=function(){page++;fetchPage(true)};
document.getElementById("kinds").onclick=function(e){var b=e.target.closest("button");if(!b)return;kind=b.dataset.kind;mode=kind==="anime"?"airing":"find";sub="plan";query="";document.getElementById("q").value="";reset()};
function itemKind(id){var x=items.filter(function(i){return String(i.id)===id})[0];return x&&x.kind?x.kind:"anime"}
function collOf(k){return k==="anime"?mine:lib[k]}
function persistOf(k){if(k==="anime")save();else saveLib()}
function cacheMedia(id){var x=items.filter(function(i){return String(i.id)===String(id)&&i.relations})[0];if(x)mineCache[x.id]=x}
document.getElementById("list").onclick=function(e){
 var o=e.target.closest("[data-open]");if(o){openDetail(Number(o.dataset.open));return}
 var g=e.target.closest("[data-go]");if(g){mode="mine";sub=g.dataset.go;query="";document.getElementById("q").value="";reset();return}
 var sb=e.target.closest("[data-sub]");if(sb){sub=sb.dataset.sub;if(kind==="anime")render();else reset();return}
 var b=e.target.closest("button"),it=e.target.closest(".item");if(!b||!it||b.dataset.a!=="toggle")return;
 var ids=(it.dataset.ids||it.dataset.id).split(","),k=itemKind(ids[0]),c=collOf(k);
 if(k==="anime"){
  if(ids.some(function(i){return i in c}))ids.forEach(function(i){delete c[i]});
  else ids.forEach(function(i){c[i]={s:"plan"};cacheMedia(i)})
 }else{
  var id=ids[0];
  if(id in c)delete c[id];
  else{var x=items.filter(function(i){return String(i.id)===id})[0];if(!x)return;c[id]={s:"plan",d:slim(x)}}
 }
 persistOf(k);afterChange(ids[0])
};
document.getElementById("list").onchange=function(e){
 var t=e.target,it=t.closest(".item");if(!it||t.dataset.a!=="status")return;
 var ids=(it.dataset.ids||it.dataset.id).split(","),k=itemKind(ids[0]),c=collOf(k);
 ids.forEach(function(i){if(i in c)c[i].s=t.value;else if(k==="anime"){c[i]={s:t.value};cacheMedia(i)}});
 persistOf(k);afterChange(ids[0])
};
function afterChange(id){
 if(mode==="mine"&&!query&&kind!=="anime")items=libItems();
 render()
}
document.getElementById("dback").onclick=function(){closeDetail(false)};
document.getElementById("dbody").onclick=function(e){
 if(!detail)return;
 var o=e.target.closest("[data-part-open]");
 if(o){var pid=Number(o.dataset.partOpen);if(pid!==detail.id)openDetail(pid,true);return}
 var t=e.target.closest("[data-ptoggle]");
 if(t){var id=t.dataset.ptoggle;if(id in mine)delete mine[id];else mine[id]={s:"plan"};save();detail.changed=true;renderDetail();render()}
};
document.getElementById("dbody").onchange=function(e){
 if(!detail)return;
 var s=e.target.closest("[data-pstatus]");
 if(s){var id=s.dataset.pstatus;if(mine[id])mine[id].s=s.value;save();detail.changed=true;renderDetail();render()}
};
window.onpopstate=function(){if(detail)closeDetail(true)};

function parseCSV(t){var rows=[],row=[],f="",q=false;t=t.replace(/^\uFEFF/,"");for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function post(query,vars,msg){
 var err="нет ответа";
 for(var t=0;t<5;t++){
  try{
   var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:query,variables:vars})});
   if(r.status===429){var w=parseInt(r.headers.get("Retry-After"),10)||60;msg.textContent="Лимит запросов AniList, ждём "+w+" с…";await sleep(w*1000);err="лимит запросов";continue}
   var j=await r.json();
   if(j.data)return{data:j.data};
   err=(j.errors&&j.errors[0]&&j.errors[0].message)||("ошибка "+r.status);
   await sleep(3000)
  }catch(e){err="сеть: "+(e&&e.message||e);await sleep(3000)}
 }
 return{err:err}
}
function mkQuery(chunk){var vars={},decl=[],body=[];chunk.forEach(function(t,i){vars["s"+i]=t.q;decl.push("$s"+i+":String");body.push("p"+i+":Page(perPage:1){media(search:$s"+i+",type:ANIME,isAdult:false,sort:SEARCH_MATCH){id}}")});return{query:"query("+decl.join(",")+"){"+body.join(" ")+"}",vars:vars}}
function res1(t,p,st){var m=p&&p.media&&p.media[0];if(m&&m.id)st.found.push({t:t,id:m.id});else st.miss.push(t)}
async function runBatches(list,label,msg,st){
 var B=5;
 for(var s=0;s<list.length;s+=B){
  var chunk=list.slice(s,s+B);
  msg.textContent=label+": "+Math.min(s+B,list.length)+" из "+list.length+"…";
  var q=mkQuery(chunk),res=await post(q.query,q.vars,msg);
  if(res.data)chunk.forEach(function(t,i){res1(t,res.data["p"+i],st)});
  else for(var k=0;k<chunk.length;k++){
   var q1=mkQuery([chunk[k]]),r1=await post(q1.query,q1.vars,msg);
   if(r1.data)res1(chunk[k],r1.data.p0,st);else{st.failed.push(chunk[k]);st.reason=r1.err}
   await sleep(2500)
  }
  await sleep(2500)
 }
}
function alt(q){return String(q).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s*\([^)]*\)/g,"").replace(/^Eiga\s+/i,"").replace(/\s*Gekijouban$/i,"").replace(/\s*(Part|Cour)\s*\d+/i,"").replace(/\s*\d+(st|nd|rd|th)\s*Season/i,"").replace(/\s*Season\s*\d+/i,"").replace(/\s*[:\-–].*$/,"").trim()}
async function viaTmdbList(list,msg,st){
 var left=[];
 for(var i=0;i<list.length;i++){
  var t=list[i];
  if(!t.ru){left.push(t);continue}
  msg.textContent="Ищем через TMDB: "+(i+1)+" из "+list.length+"…";
  try{var r=await animeViaTmdb(t.ru),m=r.media&&r.media[0];if(m)st.found.push({t:t,id:m.id});else left.push(t)}catch(e){left.push(t)}
  await sleep(300)
 }
 return left
}
async function viaShiki(list,msg,st){
 if(shikiBad)return list;
 var left=[];
 for(var i=0;i<list.length;i++){
  var t=list[i];
  if(!t.ru){left.push(t);continue}
  msg.textContent="Ищем через Shikimori: "+(i+1)+" из "+list.length+"…";
  try{
   var arr=await shiki(t.ru,1),mal=arr&&arr[0]&&arr[0].id;
   if(!mal){left.push(t);continue}
   var res=await post("query($ids:[Int]){Page(perPage:1){media(idMal_in:$ids,type:ANIME){id}}}",{ids:[Number(mal)]},msg);
   var m=res.data&&res.data.Page&&res.data.Page.media[0];
   if(m&&m.id)st.found.push({t:t,id:m.id});else left.push(t)
  }catch(e){shikiBad=true;left.push(t);for(var j=i+1;j<list.length;j++)left.push(list[j]);break}
  await sleep(1500)
 }
 return left
}
async function importList(list){
 var msg=document.getElementById("impMsg"),done={},skipped=0;
 try{done=JSON.parse(localStorage.getItem("anime:imp")||"{}")||{}}catch(e){done={}}
 var todo=list.filter(function(t){if(t.q in done&&String(done[t.q]) in mine){skipped++;if(t.ru)rt[String(done[t.q])]=t.ru;return false}return true});
 var st={found:[],miss:[],failed:[],reason:""};
 var cyr=todo.filter(function(t){return isRu(t.q)});todo=todo.filter(function(t){return!isRu(t.q)});
 await runBatches(todo,"Импорт",msg,st);st.miss=st.miss.concat(cyr);
 var second=[],keep=[];
 st.miss.forEach(function(t){var a=alt(t.q);if(a&&a!==t.q&&a.length>2)second.push({q:a,ru:t.ru,o:t.q});else keep.push(t)});
 st.miss=keep;
 if(second.length)await runBatches(second,"Уточняем поиск",msg,st);
 if(st.miss.length)st.miss=await viaShiki(st.miss,msg,st);
 if(st.miss.length&&tkey())st.miss=await viaTmdbList(st.miss,msg,st);
 st.found.forEach(function(f){var id=String(f.id);if(!(id in mine))mine[id]={s:"plan"};if(f.t.ru)rt[id]=f.t.ru;done[f.t.o||f.t.q]=f.id});
 save();saveRt();try{localStorage.setItem("anime:imp",JSON.stringify(done))}catch(e){}
 var inList=skipped+st.found.length;
 msg.textContent="В списке "+inList+" из "+list.length+"."+(st.miss.length?" Не нашлось в AniList ("+st.miss.length+"): "+st.miss.slice(0,10).map(function(t){return t.ru||t.q}).join("; ")+(st.miss.length>10?" и другие":"")+".":"")+(st.failed.length?" Не удалось проверить ("+st.failed.length+"), причина: "+st.reason+". Запустите импорт ещё раз.":"");
 mode="mine";query="";document.getElementById("q").value="";reset()
}
document.getElementById("impBtn").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(e){
 var f=e.target.files[0];if(!f)return;
 f.text().then(function(t){
  var rows=parseCSV(t).slice(1),list=[];
  rows.forEach(function(r){if(r.length<3)return;var orig=(r[2]||"").trim(),ru=(r[1]||"").trim();if(orig||ru)list.push({q:orig||ru,ru:ru})});
  e.target.value="";
  if(!list.length){document.getElementById("impMsg").textContent="В файле не нашлось названий.";return}
  importList(list)
 })
};
initReveal();load();reset();
